name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      package-manager: "pnpm"
      node-version: "22.23.2"
      prepare-command: "pnpm run build"
      test-command: "pnpm run test:coverage"
      coverage-path: "packages/cli/coverage"
      typecheck-command: "pnpm run typecheck"
      lint-command: "pnpm run lint"
      l2: true
      l2-command: "pnpm run test:e2e"
      lockfiles: "pnpm-lock.yaml"
      gitleaks-config: ".gitleaks.toml"
