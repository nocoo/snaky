name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@0394178ebcff0418c442d84a84119220f31f8987 # v2026.9
    with:
      package-manager: "pnpm"
      node-version: "22.23.2"
      prepare-command: "pnpm run build"
      test-command: "pnpm run test"
      coverage-path: ""
      typecheck-command: "pnpm run typecheck"
      lint-command: "pnpm run lint"
      l2: true
      l2-command: "pnpm run test:e2e"
      lockfiles: "pnpm-lock.yaml"
      gitleaks-config: ".gitleaks.toml"
