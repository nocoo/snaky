name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      package-manager: "pnpm"
      node-version: "22.20.0"
      build: true
      build-command: "pnpm run build"
      test-command: "pnpm run test:coverage"
      coverage-path: "packages/cli/coverage"
      typecheck-command: "pnpm run typecheck"
      lint-command: "pnpm run lint"
      l2: true
      l2-command: "pnpm run test:e2e"
      lockfiles: "pnpm-lock.yaml"
      gitleaks-config: ".gitleaks.toml"
    secrets: inherit
